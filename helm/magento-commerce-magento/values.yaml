replicaCount: 1
image:
  repository: localhost/ricky/magento-web
  tag: latest
  pullPolicy: Never
service:
  type: ClusterIP
  port: 80
  httpsPort: 443
ingress:
  host: magento.local
env:
  TZ: Australia/Melbourne
  BASE_URL: http://magento.local
  DB_HOST: mariadb
  DB_NAME: magento2
  DB_USER: magento2
  DB_PWD: magento2
  SEARCH_ENGINE: opensearch
  OPENSEARCH_HOST: opensearch
  OPENSEARCH_PORT: "9200"
mariadb:
  image: mariadb:10.6.13
  rootPassword: magento2
  storage: 10Gi
  hostPath: /data/magento/mysqldata
opensearch:
  image: opensearchproject/opensearch:2
  javaOpts: "-Xms512m -Xmx512m"
  storage: 5Gi
  hostPath: /data/magento/opensearch

apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysqldata
spec:
  capacity:
    storage: {{ .Values.mariadb.storage }}
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: {{ .Values.mariadb.hostPath }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysqldata
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.mariadb.storage }}
  volumeName: mysqldata
  storageClassName: ""
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: opensearch-data
spec:
  capacity:
    storage: {{ .Values.opensearch.storage }}
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: {{ .Values.opensearch.hostPath }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opensearch-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.opensearch.storage }}
  volumeName: opensearch-data
  storageClassName: ""

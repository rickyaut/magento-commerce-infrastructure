apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: magento-commerce-bff
  namespace: magento-commerce
spec:
  project: default
  source:
    repoURL: https://github.com/rickyaut/magento-commerce-bff.git
    targetRevision: main
    path: magento-commerce-infrastructure/magento-commerce-bff
  destination:
    server: https://kubernetes.default.svc
    namespace: magento-commerce
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

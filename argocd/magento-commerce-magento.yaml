apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: magento
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rickyaut/magento-commerce-infrastructure.git
    targetRevision: master
    path: helm/magento-commerce-magento
  destination:
    server: https://kubernetes.default.svc
    namespace: magento-commerce
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

services:
  postgres:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_DB: magento_ai
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7-alpine
    ports:
      - "6379:6379"

  magento-commerce-bff:
    build:
      context: ../../magento-commerce-bff
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/magento_ai
      SPRING_DATASOURCE_USERNAME: platform
      SPRING_DATASOURCE_PASSWORD: change-me
      MAGENTO_BASE_URL: http://magento-web
      MAGENTO_ADMIN_TOKEN: change-me
    depends_on:
      postgres:
        condition: service_healthy

  react-admin:
    build:
      context: ../../frontend/react-admin
    ports:
      - "3000:80"
    depends_on:
      - magento-commerce-bff

volumes:
  postgres_data:

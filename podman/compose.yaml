services:
  postgres:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_DB: magento_ai
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d magento_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
